<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
#pet-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
#pet-svg {
    width: 80%;
    height: 80%;
}
#bubble {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    border-radius: 12px;
    padding: 6px 12px;
    font-size: 11px;
    color: #333;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
#bubble.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-5px);
}
.duck-body { animation: float 3s ease-in-out infinite; }
.duck-eye { animation: blink 4s ease-in-out infinite; }
@keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-3px); }
}
@keyframes blink {
    0%, 95%, 100% { transform: scaleY(1); }
    97% { transform: scaleY(0.1); }
}
</style>
</head>
<body>
<div id="pet-container">
    <div id="bubble"></div>
    <svg id="pet-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- 麥输 -->
        <ellipse class="duck-body" cx="100" cy="120" rx="60" ry="50" fill="#FFD338"/>
        
        <!-- 奉田形 -->
        <ellipse cx="100" cy="70" rx="40" ry="35" fill="#FFD338"/>
        
        <!-- 眼眙 -->
        <circle class="duck-eye" cx="85" cy="65" r="7" fill="#333"/>
        <circle class="duck-eye" cx="115" cy="65" r="7" fill="#333"/>
        <circle cx="87" cy="63" r="3" fill="#fff"/>
        <circle cx="117" cy="63" r="3" fill="#fff"/>
        
        <!-- 图守 -->
        <path d="M 90 85 Q 100 95 110 85" stroke="#E59900" stroke-width="2" fill="none" stroke-linecap="round"/>
        
        <!-- ��形 -->
        <path d="M 40 130 Q 20 150 35 180 Q 45 190 60 180" stroke="#FFD338" stroke-width="12" fill="none" stroke-linecap="round"/>
        <path d="M 160 130 Q 180 150 165 180 Q 155 190 140 180" stroke="#FFD338" stroke-width="12" fill="none" stroke-linecap="round"/>
        
        <!-- 尿张 -->
        <path d="M 5 120 Q 50 110 100 110 Q 150 110 195 120" stroke="#FFB300" stroke-width="8" fill="none" stroke-linecap="round"/>
        
        <!-- 尿一个 -->
        <path d="M 95 80 Q 90 90 85 95" stroke="#E59900" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M 105 80 Q 110 90 115 95" stroke="#E59900" stroke-width="2" fill="none" stroke-linecap="round"/>
        
        <!-- 尿精 -->
        <circle cx="70" cy="110" r="10" fill="#FFD944" opacity="0.6"/>
        <circle cx="130" cy="110" r="10" fill="#FFD944" opacity="0.6"/>
    </svg>
</div>
</body>
</html>
